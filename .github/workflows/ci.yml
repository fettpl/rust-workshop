name: Verify learning product

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every run needs only the repository checkout; all unspecified token scopes are none.
permissions:
  contents: read

# Replace obsolete PR and feature-branch validations while preserving running main jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      # Verified upstream commit, resolved from dtolnay/rust-toolchain's master on 2026-09-13.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:packages
      - run: npm test
      - run: npm run content:check
      - run: npm run content:rust
      - run: npm run content:tokio -- --fetch
      - run: npm run content:async-lending -- --fetch
      - run: npm run content:operations -- --fetch
      - run: npm run content:models -- --fetch
      - run: npm run content:guessing -- --fetch
      - run: npm run content:workspace -- --fetch
      - run: npm run content:supply-chain -- --fetch
      - run: npm run content:property -- --fetch
      # Fetch Criterion before the generic archive verifier runs offline.
      - run: npm run content:performance -- --fetch
      - run: npm run content:profiles
      - run: npm run content:ffi
      # Fetch and run the restricted capstone archive verifier before the generic offline archive pass.
      - run: npm run content:capstone -- --fetch
      - name: Run capstone assessment on stable Rust
        run: npx --no-install vitest run src/content/capstone-integration-assessment.test.ts src/content/capstone-verification.test.ts
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capstone-stable-report
          path: test-results/capstone/stable/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:api-release
      - run: npm run content:api-release -- --stable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: api-release-stable-report
          path: test-results/api-release/stable/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:cargo
      - run: npm run content:manifests
      - run: npm run content:audit
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Test the production build and offline experience
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3002 > next-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat next-server.log
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 --fail --silent --show-error http://127.0.0.1:3002 >/dev/null; then
              npx playwright test --config .github/playwright.production.config.ts --retries=0
              npm run test:offline
              exit 0
            fi
            sleep 1
          done

          cat next-server.log
          exit 1
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: production-e2e-diagnostics
          path: |
            next-server.log
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 7

  workspace-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      # Verified upstream commit, resolved from dtolnay/rust-toolchain's master on 2026-09-13.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run content:guessing -- --fetch --msrv
      - run: npm run content:property -- --fetch --msrv
      - run: npm run content:tokio -- --fetch
      - run: npm run content:async-lending -- --fetch --msrv
      - run: npm run content:operations -- --fetch --msrv
      - run: npm run content:workspace -- --fetch --msrv
      - run: npm run content:supply-chain -- --fetch --msrv
      - run: npm run content:models -- --fetch --msrv
      # Fetch Proptest and Criterion before the generic archive verifier touches all Cargo packages.
      - run: npm run content:performance -- --fetch --msrv
      - run: npm run content:profiles -- --fetch --msrv
      - run: npm run content:ffi -- --msrv
      # Fetch and run the restricted capstone archive verifier before the generic offline archive pass.
      - run: npm run content:capstone -- --fetch --msrv
      - run: npm run content:api-release -- --msrv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: api-release-msrv-report
          path: test-results/api-release/msrv/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:cargo
      - run: npm run content:rust
      - run: npm run content:manifests -- --msrv
      - name: Verify GAT and Performance Evidence contracts on Rust 1.85.0
        run: |
          gat_rust_bin="$(dirname "$(rustup which --toolchain 1.85.0 rustc)")"
          "$gat_rust_bin/rustc" --version
          PATH="$gat_rust_bin:$PATH" RUSTUP_TOOLCHAIN=1.85.0 npx --no-install vitest run src/content/gat-producers.test.ts src/content/gat-consumers.test.ts src/content/gat-assessment.test.ts src/content/performance-evidence-assessment.test.ts src/content/capstone-integration-assessment.test.ts src/content/capstone-verification.test.ts
      - name: Verify fuzz evidence assessments on Rust 1.85.0
        run: |
          fuzz_rust_bin="$(dirname "$(rustup which --toolchain 1.85.0 rustc)")"
          "$fuzz_rust_bin/rustc" --version
          PATH="$fuzz_rust_bin:$PATH" RUSTUP_TOOLCHAIN=1.85.0 npx --no-install vitest run src/content/fuzz-evidence-assessment.test.ts src/content/fuzz-evidence-integration.test.ts src/content/fuzz-evidence-verification.test.ts
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capstone-msrv-report
          path: test-results/capstone/msrv/report.json
          if-no-files-found: warn
          retention-days: 7

  mini-grep-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      # Verified upstream commit, resolved from dtolnay/rust-toolchain's master on 2026-09-13.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-08-08
          components: rustfmt
      # The stable regression and MSRV replay are pinned independently from nightly instrumentation.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.85.0
      - name: Install cargo-fuzz with the pinned nightly
        run: cargo +nightly-2026-08-08 install cargo-fuzz --version 0.13.2 --locked
      - name: Check cargo-fuzz toolchain
        run: cargo +nightly-2026-08-08 fuzz --version
      - run: npm ci
      - run: npm run content:fuzz -- --fetch
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mini-grep-fuzz-evidence
          path: test-results/mini-grep-fuzz/
          if-no-files-found: warn
          retention-days: 7

  profile-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # v6.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      # Valgrind is an explicit environment prerequisite for fresh Callgrind evidence.
      - name: Install Valgrind when the runner image does not provide it
        shell: bash
        run: |
          if ! command -v valgrind >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes valgrind
          fi
      # Verified upstream commit, resolved from dtolnay/rust-toolchain's master on 2026-09-13.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - name: Collect fresh Callgrind and DHAT reports
        env:
          PROFILE_OUTPUT_DIR: profile-evidence
        run: |
          npm run content:profiles -- --fetch --profile=callgrind
          npm run content:profiles -- --fetch --profile=dhat
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: log-analyzer-profile-evidence
          path: profile-evidence/
          if-no-files-found: error
          retention-days: 7

  allocation-evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            verifier: "npm run content:allocations -- --fetch"
            artifact: allocation-stable-ubuntu
          - os: ubuntu-latest
            toolchain: 1.85.0
            verifier: "npm run content:allocations -- --fetch --msrv"
            artifact: allocation-msrv-ubuntu
          - os: macos-latest
            toolchain: stable
            verifier: "npm run content:allocations -- --fetch"
            artifact: allocation-stable-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: npm ci
      - run: ${{ matrix.verifier }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: test-results/allocations/
          if-no-files-found: warn
          retention-days: 7

  miri-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      # Verified locally and in rustup's component index on 2026-09-18.
      # The date is pinned because Miri is coupled to its nightly compiler.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly-2026-08-08
          components: miri, rust-src
      - run: npm ci
      - run: npm run content:miri -- --fetch
      - run: npm run content:miri -- --msrv --fetch

  unsafe-borrowed-memory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: stable
            toolchain: stable
            args: ""
          - mode: msrv
            toolchain: 1.85.0
            args: --msrv
          - mode: miri
            toolchain: nightly-2026-08-08
            args: --miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy${{ matrix.mode == 'miri' && ', miri, rust-src' || '' }}
      - run: npm ci
      - name: Run authored borrowed-memory verifier
        run: BORROWED_MEMORY_ARTIFACT_DIR=borrowed-memory-artifacts node --import tsx scripts/verify-borrowed-memory.ts ${{ matrix.args }} > borrowed-memory-${{ matrix.mode }}.json
      - name: Check Rust tool metadata
        run: rustfmt --version && cargo fmt --version && cargo clippy --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unsafe-borrowed-memory-${{ matrix.mode }}
          path: borrowed-memory-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: unsafe-borrowed-memory-evidence-${{ matrix.mode }}
          path: borrowed-memory-artifacts
          if-no-files-found: warn
          retention-days: 7
