name: Verify learning product

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every run needs only the repository checkout; all unspecified token scopes are none.
permissions:
  contents: read

# Replace obsolete PR and feature-branch validations while preserving running main jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # Verified upstream commit 683b588c487a69d01f6c6ddf40f036ff682cc2c8 via GitHub on 2026-10-24.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - name: Prepare current native-proof unit prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p initialized-prefix-unit-artifacts/toolchains
          printf '[net]\noffline = true\n' > initialized-prefix-unit-artifacts/cargo-config.toml
          QUALIFICATION_DIR="${GITHUB_WORKSPACE}/initialized-prefix-unit-artifacts/toolchains" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, realpathSync, writeFileSync } from "node:fs";
          import { resolve } from "node:path";
          const outputDirectory = resolve(process.env.QUALIFICATION_DIR);
          mkdirSync(outputDirectory, { recursive: true });
          const text = (command, args) => execFileSync(command, args, { encoding: "utf8" });
          const ref = (path) => {
            const absolute = realpathSync(resolve(path.trim()));
            const bytes = readFileSync(absolute);
            return { path: absolute, bytes: bytes.byteLength, sha256: createHash("sha256").update(bytes).digest("hex") };
          };
          const completeOutput = (value) => value.trim();
          const qualification = (mode, toolchain) => {
            const names = ["rustup", "rustc", "rustdoc", "cargo"];
            const paths = Object.fromEntries(names.map((name) => [
              name,
              ref(name === "rustup" ? text("which", ["rustup"]) : text("rustup", ["which", "--toolchain", toolchain, name])),
            ]));
            const versions = Object.fromEntries(names.map((name) => [
              name,
              completeOutput(name === "rustup" ? text(paths[name].path, ["--version"]) : text("rustup", ["run", toolchain, name, "--version", "--verbose"])),
            ]));
            const payload = { schema: "initialized-prefix-toolchain-qualification-v1", mode, toolchain, executables: paths, versionContains: versions };
            if (mode === "miri") {
              const compiler = text("rustup", ["run", toolchain, "rustc", "--version", "--verbose"]);
              const commitDate = compiler.match(/^commit-date:\s*(\d{4}-\d{2}-\d{2})$/m)?.[1];
              if (!commitDate) throw new Error("nightly compiler commit date was not reported");
              payload.nightlyDistributionDate = "2026-08-08";
              payload.compilerCommitDate = commitDate;
            }
            writeFileSync(`${outputDirectory}/${mode}.json`, `${JSON.stringify(payload, null, 2)}\n`);
          };
          qualification("stable", "stable");
          NODE
      - name: Prepare locked Tokio dependencies for offline native checks
        run: cargo fetch --locked --manifest-path scripts/fixtures/tokio-runtime-1.54.1/Cargo.toml
      - name: Test native runtime version minimums
        run: npm run test:sharp-runtime
      - name: Verify Linux sharp native runtime and SVG decoder
        run: node scripts/verify-sharp-runtime.mjs
      - name: Verify production audit gate failure propagation
        run: npm run test:audit-production
      - name: Run full and production dependency audits
        run: npm run audit:production
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: dependency-audit-reports
          path: test-results/dependency-audit/
          if-no-files-found: error
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:packages
      - name: Run full unit suite with authorized native recorder controls
        env:
          RUST_WORKSHOP_INITIALIZED_PREFIX_CARGO_CONFIG: ${{ github.workspace }}/initialized-prefix-unit-artifacts/cargo-config.toml
          RUST_WORKSHOP_INITIALIZED_PREFIX_ARTIFACT_DIR: ${{ github.workspace }}/initialized-prefix-unit-artifacts
          RUST_WORKSHOP_INITIALIZED_PREFIX_CONTROLS_AUTHORIZED: "1"
          RUST_WORKSHOP_INITIALIZED_PREFIX_TOOLCHAIN_QUALIFICATION: ${{ github.workspace }}/initialized-prefix-unit-artifacts/toolchains/stable.json
        run: npm test
      - run: npm run content:check
      - run: npm run content:rust
      - run: npm run content:tokio -- --fetch
      - run: npm run content:async-lending -- --fetch
      - run: npm run content:operations -- --fetch
      - run: npm run content:models -- --fetch
      - run: npm run content:guessing -- --fetch
      - run: npm run content:workspace -- --fetch
      - run: npm run content:supply-chain -- --fetch
      - run: npm run content:property -- --fetch
      # Fetch Criterion before the generic archive verifier runs offline.
      - run: npm run content:performance -- --fetch
      - name: Fetch locked client retry dependencies
        run: bash scripts/fetch-client-retry-dependencies.sh
      - name: Verify bounded client retry on stable Rust
        run: npm run content:client-retry
      - name: Verify typed authorization on stable Rust
        run: npm run content:authorization
      - name: Verify file schema evolution on stable Rust
        run: npm run content:file-schema-evolution -- --mode stable
      - name: Verify closed performance investigation on stable Rust
        run: npm run content:performance -- --a7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: performance-investigation-stable-report
          path: |
            test-results/performance-a7/a7-stable-*/
            !test-results/performance-a7/**/target/**
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:profiles
      - run: npm run content:ffi
      # Fetch and run the restricted capstone archive verifier before the generic offline archive pass.
      - run: npm run content:capstone -- --fetch
      - name: Run capstone assessment on stable Rust
        run: npx --no-install vitest run src/content/capstone-integration-assessment.test.ts src/content/capstone-verification.test.ts
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: capstone-stable-report
          path: test-results/capstone/stable/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:api-release
      - run: npm run content:api-release -- --stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: api-release-stable-report
          path: test-results/api-release/stable/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:macro-contracts
      - run: npm run content:macro-contracts -- --stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macro-contracts-stable-report
          path: test-results/macro-contracts/stable/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:cargo
      - run: npm run content:manifests
      - run: npm run content:audit
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - name: Test the production build and offline experience
        shell: bash
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3002 > next-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat next-server.log
              exit 1
            fi
            if curl --connect-timeout 1 --max-time 2 --fail --silent --show-error http://127.0.0.1:3002 >/dev/null; then
              npx playwright test --config .github/playwright.production.config.ts --retries=0
              npm run test:offline
              exit 0
            fi
            sleep 1
          done

          cat next-server.log
          exit 1
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: production-e2e-diagnostics
          path: |
            next-server.log
            playwright-report/
            test-results/playwright/
          if-no-files-found: warn
          retention-days: 7

  workspace-msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # Verified upstream commit 683b588c487a69d01f6c6ddf40f036ff682cc2c8 via GitHub on 2026-10-24.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Install Rust 1.89.0 for the two Durable Log workspaces
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci
      - name: Prepare locked Tokio dependencies for offline native checks
        run: cargo fetch --locked --manifest-path scripts/fixtures/tokio-runtime-1.54.1/Cargo.toml
      - run: npm run content:guessing -- --fetch --msrv
      - run: npm run content:property -- --fetch --msrv
      - run: npm run content:tokio -- --fetch
      - run: npm run content:async-lending -- --fetch --msrv
      - run: npm run content:operations -- --fetch --msrv
      - run: npm run content:workspace -- --fetch --msrv
      - run: npm run content:supply-chain -- --fetch --msrv
      - run: npm run content:models -- --fetch --msrv
      # Fetch Proptest and Criterion before the generic archive verifier touches all Cargo packages.
      - run: npm run content:performance -- --fetch --msrv
      - name: Fetch locked client retry dependencies
        env:
          RUSTUP_TOOLCHAIN: "1.89.0"
        run: bash scripts/fetch-client-retry-dependencies.sh
      - name: Verify bounded client retry on Rust 1.89.0
        run: npm run content:client-retry -- --msrv
      - name: Verify typed authorization on Rust 1.85.0
        run: npm run content:authorization -- --msrv
      - name: Verify file schema evolution on Rust 1.85.0
        run: npm run content:file-schema-evolution -- --mode msrv
      - name: Verify closed performance investigation on msrv Rust
        run: npm run content:performance -- --a7 --msrv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: performance-investigation-msrv-report
          path: |
            test-results/performance-a7/a7-msrv-*/
            !test-results/performance-a7/**/target/**
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:profiles -- --fetch --msrv
      - run: npm run content:ffi -- --msrv
      # Fetch and run the restricted capstone archive verifier before the generic offline archive pass.
      - run: npm run content:capstone -- --fetch --msrv
      - run: npm run content:api-release -- --msrv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: api-release-msrv-report
          path: test-results/api-release/msrv/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run test:macro-contracts
      - run: npm run content:macro-contracts -- --msrv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macro-contracts-msrv-report
          path: test-results/macro-contracts/msrv/report.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run content:cargo -- --msrv
      - run: npm run content:rust
      - run: npm run content:manifests -- --msrv
      - name: Verify baseline, GAT and Performance Evidence contracts on Rust 1.85.0
        run: |
          gat_rust_bin="$(dirname "$(rustup which --toolchain 1.85.0 rustc)")"
          "$gat_rust_bin/rustc" --version
          PATH="$gat_rust_bin:$PATH" RUSTUP_TOOLCHAIN=1.85.0 npx --no-install vitest run src/content/documentation-guided-repair-rust.test.ts src/content/fallible-composition-rust.test.ts src/content/baseline-primitives-rust.test.ts src/content/baseline-patterns-contracts.test.ts src/content/baseline-execution-assessment.test.ts src/content/gat-producers.test.ts src/content/gat-consumers.test.ts src/content/gat-assessment.test.ts src/content/performance-evidence-assessment.test.ts src/content/capstone-integration-assessment.test.ts src/content/capstone-verification.test.ts
      - name: Verify ownership foundation native fixtures on Rust 1.85.0
        env:
          RUST_WORKSHOP_FOUNDATION_TOOLCHAIN: "1.85.0"
        run: npx --no-install vitest run src/content/ownership-foundation-values.test.ts src/content/ownership-foundation-drop.test.ts
      - name: Verify fuzz evidence assessments on Rust 1.85.0
        run: |
          fuzz_rust_bin="$(dirname "$(rustup which --toolchain 1.85.0 rustc)")"
          "$fuzz_rust_bin/rustc" --version
          PATH="$fuzz_rust_bin:$PATH" RUSTUP_TOOLCHAIN=1.85.0 npx --no-install vitest run src/content/fuzz-evidence-assessment.test.ts src/content/fuzz-evidence-integration.test.ts src/content/fuzz-evidence-verification.test.ts
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: capstone-msrv-report
          path: test-results/capstone/msrv/report.json
          if-no-files-found: warn
          retention-days: 7

  mini-grep-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # Verified upstream commit 683b588c487a69d01f6c6ddf40f036ff682cc2c8 via GitHub on 2026-10-24.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-08-08
          components: rustfmt
      # The stable regression and MSRV replay are pinned independently from nightly instrumentation.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.0
      - name: Install cargo-fuzz with the pinned nightly
        run: cargo +nightly-2026-08-08 install cargo-fuzz --version 0.13.2 --locked
      - name: Check cargo-fuzz toolchain
        run: cargo +nightly-2026-08-08 fuzz --version
      - run: npm ci
      - run: npm run content:fuzz -- --fetch
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mini-grep-fuzz-evidence
          path: test-results/mini-grep-fuzz/
          if-no-files-found: warn
          retention-days: 7

  profile-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      # Valgrind is an explicit environment prerequisite for fresh Callgrind evidence.
      - name: Install Valgrind when the runner image does not provide it
        shell: bash
        run: |
          if ! command -v valgrind >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes valgrind
          fi
      # Verified upstream commit 683b588c487a69d01f6c6ddf40f036ff682cc2c8 via GitHub on 2026-10-24.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: npm ci
      - name: Collect fresh Callgrind and DHAT reports
        env:
          PROFILE_OUTPUT_DIR: profile-evidence
        run: |
          npm run content:profiles -- --fetch --profile=callgrind
          npm run content:profiles -- --fetch --profile=dhat
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: log-analyzer-profile-evidence
          path: profile-evidence/
          if-no-files-found: error
          retention-days: 7

  allocation-evidence:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            verifier: "npm run content:allocations -- --fetch"
            artifact: allocation-stable-ubuntu
          - os: ubuntu-latest
            toolchain: 1.85.0
            verifier: "npm run content:allocations -- --fetch --msrv"
            artifact: allocation-msrv-ubuntu
          - os: macos-latest
            toolchain: stable
            verifier: "npm run content:allocations -- --fetch"
            artifact: allocation-stable-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: npm ci
      - run: ${{ matrix.verifier }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: test-results/allocations/
          if-no-files-found: warn
          retention-days: 7

  miri-safety:
    runs-on: ubuntu-latest
    # Stable and MSRV retain their 8-minute configured deadlines. Miri has a
    # 30-minute total deadline for the full capture and control campaign,
    # including qualification, commands, controls, and failure retention. The
    # resulting 46-minute plan fits inside this 60-minute job with 14 minutes
    # of setup and failure-retention headroom. Deadline checks are
    # cooperative: synchronous filesystem hashing can overrun the configured
    # deadline, and retained incomplete evidence records that measured
    # overrun; any campaign beyond its deadline remains failed, and no hard
    # OS/I/O termination guarantee is claimed.
    timeout-minutes: 60
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - name: Reclaim unused hosted-runner SDKs before Rust setup
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${RUNNER_ENVIRONMENT:-}" != "github-hosted" || "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "Refusing hosted-runner SDK cleanup outside the expected GitHub-hosted Linux environment."
            exit 1
          fi
          . /etc/os-release
          if [[ "${ID:-}" != "ubuntu" ]]; then
            echo "Refusing hosted-runner SDK cleanup on non-Ubuntu Linux: ${ID:-unknown}"
            exit 1
          fi
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          df -Pk "$workspace"
          for sdk in /usr/local/lib/android /usr/share/dotnet; do
            if [[ -L "$sdk" ]]; then
              echo "Refusing to remove symlink SDK path: $sdk"
              exit 1
            fi
            if [[ -e "$sdk" ]]; then
              if [[ ! -d "$sdk" ]]; then
                echo "Refusing non-directory SDK path: $sdk"
                exit 1
              fi
              resolved="$(realpath -e -- "$sdk")"
              if [[ "$resolved" != "$sdk" ]]; then
                echo "Refusing unexpected SDK path resolution: $sdk -> $resolved"
                exit 1
              fi
              sudo rm -rf -- "$sdk"
            else
              echo "SDK path absent: $sdk"
            fi
          done
          df -Pk "$workspace"
      # Upstream rust-toolchain commit 683b588c487a69d01f6c6ddf40f036ff682cc2c8 verified via GitHub on 2026-10-24; action runtime is unchanged.
      # The date is pinned because Miri is coupled to its nightly compiler.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-08-08
          components: miri, rust-src
      - run: npm ci
      - name: Prepare explicit offline native-proof inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p initialized-prefix-native-inputs initialized-prefix-artifacts/toolchains initialized-prefix-public-summaries
          printf '[net]\noffline = true\n' > initialized-prefix-native-inputs/cargo-config.toml
          cargo +nightly-2026-08-08 miri setup
          sysroot="$(cargo +nightly-2026-08-08 miri setup --print-sysroot)"
          test -d "$sysroot"
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 && $4 ~ /^[0-9]+$/ { print $4 }')"
          if [[ ! "$available_kib" =~ ^[0-9]+$ ]]; then
            echo "Could not read numeric free-space value for $GITHUB_WORKSPACE"
            exit 1
          fi
          minimum_kib=$((20 * 1024 * 1024))
          if (( available_kib < minimum_kib )); then
            echo "Insufficient free space after Miri sysroot setup: ${available_kib} KiB; need at least ${minimum_kib} KiB"
            df -Pk "$GITHUB_WORKSPACE"
            exit 1
          fi
          echo "Free-space floor passed after Miri sysroot setup: ${available_kib} KiB"
          SYSROOT="$sysroot" OUTPUT_DIRECTORY="${GITHUB_WORKSPACE}/initialized-prefix-native-inputs" QUALIFICATION_DIRECTORY="${GITHUB_WORKSPACE}/initialized-prefix-artifacts/toolchains" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdirSync, readFileSync, readdirSync, realpathSync, writeFileSync } from "node:fs";
          import { dirname, join, resolve } from "node:path";
          const root = resolve(process.env.SYSROOT);
          const outputDirectory = resolve(process.env.OUTPUT_DIRECTORY);
          const qualificationDirectory = resolve(process.env.QUALIFICATION_DIRECTORY);
          mkdirSync(outputDirectory, { recursive: true });
          mkdirSync(qualificationDirectory, { recursive: true });
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const ref = (path) => {
            const absolute = realpathSync(resolve(path.trim()));
            const bytes = readFileSync(absolute);
            return { path: absolute, bytes: bytes.byteLength, sha256: hash(bytes) };
          };
          const completeOutput = (value) => value.trim();
          const files = [];
          const walk = (directory) => {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
                if (entry.isSymbolicLink()) throw new Error(`sysroot contains symlink: ${path}`);
                if (entry.isDirectory()) walk(path);
                else if (entry.isFile()) files.push(ref(path));
                else throw new Error(`sysroot contains unsupported entry: ${path}`);
            }
          };
          const canonicalRoot = realpathSync(root);
          walk(canonicalRoot);
          writeFileSync(`${outputDirectory}/miri-sysroot.json`, `${JSON.stringify({ schema: "initialized-prefix-sysroot-v1", root: canonicalRoot, toolchain: "nightly-2026-08-08", complete: true, files }, null, 2)}\n`);
          const text = (command, args) => execFileSync(command, args, { encoding: "utf8" });
          const qualification = (mode, toolchain, includeMiri = false) => {
            const names = ["rustup", "rustc", "rustdoc", "cargo", ...(includeMiri ? ["cargo-miri", "miri"] : [])];
            const rustcPath = text("rustup", ["which", "--toolchain", toolchain, "rustc"]).trim();
            const selectedToolBin = dirname(rustcPath);
            const selected = (name) => includeMiri && (name === "cargo-miri" || name === "miri")
              ? join(selectedToolBin, name)
              : name === "rustup"
                ? text("which", ["rustup"])
                : text("rustup", ["which", "--toolchain", toolchain, name]);
            const paths = Object.fromEntries(names.map((name) => [
              name,
              ref(selected(name)),
            ]));
            const versions = Object.fromEntries(names.map((name) => [
              name,
              completeOutput(name === "rustup" || name === "miri"
                ? text(paths[name].path, ["--version"])
                : name === "cargo-miri"
                  ? text(paths[name].path, ["miri", "--version"])
                : text("rustup", ["run", toolchain, name, "--version", "--verbose"])),
            ]));
            const payload = { schema: "initialized-prefix-toolchain-qualification-v1", mode, toolchain, executables: paths, versionContains: versions };
            if (mode === "miri") {
              const compiler = text("rustup", ["run", toolchain, "rustc", "--version", "--verbose"]);
              const commitDate = compiler.match(/^commit-date:\s*(\d{4}-\d{2}-\d{2})$/m)?.[1];
              if (!commitDate) throw new Error("nightly compiler commit date was not reported");
              payload.nightlyDistributionDate = "2026-08-08";
              payload.compilerCommitDate = commitDate;
            }
            writeFileSync(`${qualificationDirectory}/${mode}.json`, `${JSON.stringify(payload, null, 2)}\n`);
          };
          qualification("stable", "stable");
          qualification("msrv", "1.85.0");
          qualification("miri", "nightly-2026-08-08", true);
          NODE
          {
            echo "RUST_WORKSHOP_INITIALIZED_PREFIX_CARGO_CONFIG=${GITHUB_WORKSPACE}/initialized-prefix-native-inputs/cargo-config.toml"
            echo "RUST_WORKSHOP_INITIALIZED_PREFIX_SYSROOT_MANIFEST=${GITHUB_WORKSPACE}/initialized-prefix-native-inputs/miri-sysroot.json"
            echo "MIRI_SYSROOT=${sysroot}"
            echo "RUST_WORKSHOP_INITIALIZED_PREFIX_ARTIFACT_DIR=${GITHUB_WORKSPACE}/initialized-prefix-artifacts"
            echo "RUST_WORKSHOP_INITIALIZED_PREFIX_TOOLCHAIN_QUALIFICATION_DIRECTORY=${GITHUB_WORKSPACE}/initialized-prefix-artifacts/toolchains"
            echo "RUST_WORKSHOP_INITIALIZED_PREFIX_PUBLIC_SUMMARY=${GITHUB_WORKSPACE}/initialized-prefix-public-summaries/stable.json"
          } >> "$GITHUB_ENV"
      - name: Observe Linux canonical-path resolver parity
        run: node scripts/benchmark-canonical-paths.mjs initialized-prefix-native-inputs/miri-sysroot.json
      - run: npm run content:miri -- --fetch
      - name: Set MSRV public native-proof summary path
        run: echo "RUST_WORKSHOP_INITIALIZED_PREFIX_PUBLIC_SUMMARY=${GITHUB_WORKSPACE}/initialized-prefix-public-summaries/msrv.json" >> "$GITHUB_ENV"
      - run: npm run content:miri -- --msrv --fetch
      # Same-repository public status only; raw streams, command archives, source/compiler
      # evidence, private homes, targets, caches, and sysroot packets remain local.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: initialized-prefix-native-summary
          path: initialized-prefix-public-summaries/*.json
          if-no-files-found: warn
          retention-days: 7

  unsafe-borrowed-memory:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: stable
            toolchain: stable
            args: ""
          - mode: msrv
            toolchain: 1.85.0
            args: --msrv
          - mode: miri
            toolchain: nightly-2026-08-08
            args: --miri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy${{ matrix.mode == 'miri' && ', miri, rust-src' || '' }}
      - run: npm ci
      - name: Run authored borrowed-memory verifier
        run: BORROWED_MEMORY_ARTIFACT_DIR=borrowed-memory-artifacts node --import tsx scripts/verify-borrowed-memory.ts ${{ matrix.args }} > borrowed-memory-${{ matrix.mode }}.json
      - name: Check Rust tool metadata
        run: rustfmt --version && cargo fmt --version && cargo clippy --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unsafe-borrowed-memory-${{ matrix.mode }}
          path: borrowed-memory-${{ matrix.mode }}.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: unsafe-borrowed-memory-evidence-${{ matrix.mode }}
          path: borrowed-memory-artifacts
          if-no-files-found: warn
          retention-days: 7
