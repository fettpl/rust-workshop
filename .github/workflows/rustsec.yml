name: Audit shipped Rust dependencies

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-rustsec:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run content:packages
      - name: Install pinned cargo-audit
        run: bash scripts/install-cargo-audit.sh
      - name: Audit shipped Rust lockfiles and native fixtures
        id: rustsec-audit
        run: npm run audit:rustsec
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.rustsec-audit.outcome != 'skipped'
        with:
          name: rustsec-audit-report
          path: test-results/rustsec-audit/report.json
          if-no-files-found: error
          retention-days: 7
